name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Sin secretos: la suite es determinista y sin red externa. Las env vars
# DELM_MODEL/DELM_BASE_URL son valores placeholder (no secretos): el
# dry-run de run_real_demo solo resuelve la config, no llama al modelo.

jobs:
  # Suite completa (pytest). El addopts por defecto (-m 'not slow') excluye
  # los tests de integración lentos (handshake QUIC, subprocess) para que el
  # CI sea rápido; los tests de red local (loopback) y de lógica corren aquí.
  suite:
    name: suite-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar smcp[all] + deps de test
        run: python -m pip install --upgrade pip && pip install -e ".[all]" -r requirements.txt
      - name: Suite completa (pytest)
        run: python -m pytest

  # Demos (las 4, como pasos separados para fail-fast por demo).
  #   1. run_demo           -> el pipeline end-to-end (sin API key)
  #   2. run_security_demo -> Capas 1+2 (firma, integridad, inmutabilidad)
  #   3. run_taint_demo    -> Capa 5 (cuarentena de prompt-injection)
  #   4. run_real_demo --dry-run -> resuelve la config (no llama al modelo)
  # El dry-run necesita DELM_MODEL/DELM_BASE_URL (placeholder, no secreto):
  # sin config committed (git-ignored) ni env, el dry-run retorna 2.
  demos:
    name: demos-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Placeholder: el dry-run solo resuelve la config, no llama al modelo.
      DELM_MODEL: ci-placeholder-model
      DELM_BASE_URL: http://127.0.0.1:1/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar smcp[all] + deps de test
        run: python -m pip install --upgrade pip && pip install -e ".[all]" -r requirements.txt
      - name: "demo 1: run_demo (pipeline end-to-end)"
        run: python -m smcp.demo.run_demo
      - name: "demo 2: run_security_demo (Capas 1+2)"
        run: python -m smcp.demo.run_security_demo
      - name: "demo 3: run_taint_demo (Capa 5)"
        run: python -m smcp.demo.run_taint_demo
      - name: "demo 4: run_real_demo --dry-run (resuelve la config)"
        run: python -m smcp.demo.run_real_demo --dry-run

  # Gates de calidad (P4). Antes de esto el CI no tenia NINGUNO: ni lint, ni
  # tipos, ni cobertura. Una suite verde no puede detectar ni el drift del
  # bloque `Estructura` del README ni el hecho de que el wheel no shippease
  # la capa web.
  #
  # Se instala `.[all]` A PROPOSITO, no `.[dev]`: los extras opcionales
  # (agent-client-protocol, aioquic, websockets, aiozeroconf) cambian la
  # cobertura de forma grande — con el SDK ACP ausente, los 20 tests de
  # test_serve.py corren en modo degradado y serve.py marca 11% en vez de
  # 77%. Un gate medido con un conjunto de dependencias distinto del de
  # produccion mide otra cosa.
  quality:
    name: lint + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar smcp[all] + deps de test
        run: python -m pip install --upgrade pip && pip install -e ".[all]" -r requirements.txt
      # Los gates viven en smcp/core/gates.py y el CI llama al mismo runner
      # que `smcp gates`. `readme` esta aqui porque el README declara un conteo
      # de tests que debe cuadrar con `pytest --collect-only -q`; el job
      # readme-check que lo hacia por su cuenta fue eliminado, porque dos
      # copias de un gate es una que se puede encoger sin que nada falle.
      # que `smcp gates`. Una lista de gates duplicada en el workflow es una
      # lista que se encoge sin que nada falle: el build se debilita en
      # silencio. `ruff format --check` NO es gate todavia, a proposito:
      # reformatear 81 de 92 archivos mezclaria un cambio cosmetico sobre
      # 12.100 lineas con los hallazgos reales del type-checker. Formatear
      # es un commit propio (sin logica) y despues se activa.
      - name: Gates (readme, ruff, pyright, tests)
        run: python -m smcp gates --blocking
      - name: Cobertura
        run: python -m pytest --cov=smcp --cov-report=term:skip-covered -q

