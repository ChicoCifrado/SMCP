#
# Local server example:
#   model:    "qwen2.5-7b-instruct"
#   base_url: "http://127.0.0.1:8000/v1"
#   api_key:  "EMPTY"
#
# This file is a template only; it is NOT read at runtime. Pass the three
# values to OpenAICompatibleClient directly (see README "Using a real model").
